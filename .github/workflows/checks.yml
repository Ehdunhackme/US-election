name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: python -m election_forecast build
      - run: python -m pytest -q
      - run: npm ci
      - run: npm run article
      - run: npm run check:article
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        with:
          name: forecast-and-article
          path: |
            site/index.html
            reports/*.csv
            reports/run.json
            reports/*.png
            reports/*.svg
            test-results/**/*.png
